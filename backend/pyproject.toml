# Backend Biblioteca de Recursos Multimedia — gestionado con uv
# Instalación:  uv sync          (crea .venv + uv.lock, incluye herramientas dev)
# Ejecución:    uv run uvicorn app.main:app --reload
# Tests:        uv run pytest
# Linter:       uv run ruff check . --fix ; uv run ruff format .

[project]
name = "biblioteca-recursos-multimedia-backend"
version = "0.1.0"
description = "Backend FastAPI de Biblioteca de Recursos Multimedia"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "pydantic-settings==2.16.2",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "pyjwt==2.15.1",
    "email-validator==2.3.0",
    "python-multipart==0.0.33",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.3",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "B008", # Depends(...) en defaults: patrón estándar de FastAPI
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
