# Deploy de la Pi: API pública en su puerto + nginx (página web SPA + proxy).
# TLS lo maneja Cloudflare (proxy naranja): al origen solo le llega HTTP en el 80.
# Config por el .env de ESTA carpeta (copiar .env.example → .env; IMAGE_TAG + API_PORT).
# La API también abre su propio puerto público (API_PORT) para apps/páginas directas.
services:
  api:
    image: l20j45/biblioteca-recursos-multimedia-api:${IMAGE_TAG:-latest}
    # Puerto público: apps de escritorio, APK y otras páginas del proyecto
    # hablan directo con la API aquí (sincronización multi-dispositivo).
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - backend.env             # SECRET_KEY / CORS / SMTP (gitignoreado)
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      MEDIA_DIR: /app/data/uploads
    volumes:
      - api-data:/app/data
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "80:80"                 # origen HTTP; el HTTPS lo pone Cloudflare
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/usr/share/nginx/html:ro   # la SPA compilada (deploy.sh la llena)
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
