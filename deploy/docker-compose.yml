# Deploy de la Pi: API pública :4010 + nginx web en :4011 (TLS lo maneja Cloudflare).
# Config por el .env de ESTA carpeta (copiar .env.example → .env; IMAGE_TAG/API_PORT/WEB_PORT).
# La API también abre su propio puerto público para apps/páginas directas.
services:
  api:
    image: l20j45/biblioteca-recursos-multimedia-api:${IMAGE_TAG:-latest}
    # Puerto público: apps de escritorio, APK y otras páginas del proyecto
    # hablan directo con la API aquí (sincronización multi-dispositivo).
    ports:
      - "${API_PORT:-4010}:8000"
    env_file:
      - backend.env             # SECRET_KEY / CORS / SMTP (gitignoreado)
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      MEDIA_DIR: /app/data/uploads
    volumes:
      - api-data:/app/data
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-4011}:80"  # SPA + proxy de la API interna (api:8000)
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/usr/share/nginx/html:ro   # la SPA compilada (deploy.sh la llena)
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
