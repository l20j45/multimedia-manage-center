# nginx — página web (SPA) + reverse proxy de la API en el mismo dominio.
# TLS lo termina Cloudflare: aquí solo escuchamos HTTP en el 80.
server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# uploads de multimedia sin límite (la API valida tamaño/usuario)
	client_max_body_size 0;

	# assets de Vite: huella inmutable
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# rutas de la API (mismos prefijos que los routers de FastAPI)
	location ~ ^/(health|health/|auth|users|media|collections|settings) {
		proxy_pass http://api:8000;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
	}

	# SPA: cualquier otra ruta → index.html
	location / {
		try_files $uri /index.html;
	}
}
