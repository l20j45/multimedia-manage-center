# release.yml — instalables de escritorio vía tauri-action.
#
# Disparo:
#   - Al pushear un tag `v*` (ej. `git tag v0.1.0 && git push origin v0.1.0`)
#     → crea un GitHub Release con los instaladores adjuntos.
#   - Manual con workflow_dispatch → genera los artefactos en el run (sin release).
#
# Genera por plataforma:
#   - windows-latest → .msi, .exe (NSIS)
#   - macOS/Linux se agregan fácil como jobs hermanos (runner y cache iguales).
#
# Notas:
# - Tauri no permite cross-compilar hacia Windows desde macOS/Linux; por eso el
#   instalador de Windows se construye aquí y no en local.
# - VITE_API_URL se inyecta como variable de entorno (vite.config.ts usa
#   envDir: ".." para el .env raíz, que no existe en CI).
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Contenedor multi-arquitectura (Docker Hub) — corre en linux con buildx+QEMU;
  # es el artefacto para desplegar la API (docker compose up) y la RPi arm64.
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraer tag de imagen (v0.10 → 0.10)
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/biblioteca-recursos-multimedia-api:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/biblioteca-recursos-multimedia-api:v${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Web estática compilada y adjunta al release (la baja bootstrap.sh en la Pi).
  # needs: build-windows → tauri-action es quien CREA el release; sin esta dependencia
  # el upload puede correr antes de que el release exista.
  build-web:
    runs-on: ubuntu-latest
    needs: build-windows
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Compilar SPA
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:8000' }}
        run: pnpm run build

      - name: Empaquetar dist/ → web-dist.tar.gz
        run: tar czf web-dist.tar.gz -C frontend/dist .

      - name: Adjuntar al GitHub Release
        if: github.event_name == 'push' # en workflow_dispatch no hay release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" web-dist.tar.gz --clobber

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "frontend/src-tauri"

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Generar instaladores Windows
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:8000' }}
        with:
          projectPath: frontend
          includeDebug: false
          includeRelease: true
          tagName: ${{ github.ref_name }}
          releaseName: "Biblioteca de Recursos Multimedia v__VERSION__"
          releaseDraft: false
          prerelease: false
