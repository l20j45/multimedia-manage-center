# CI: backend (uv + pytest + ruff) y frontend (pnpm + vitest + tsc/vite)
# en cada push y PR. Rápido: sin Docker, deps cacheadas.
name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Instala uv (cache incluida)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Deps
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Instala pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node (cache pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Deps
        run: pnpm install --frozen-lockfile

      - name: Tests (vitest)
        run: pnpm test

      - name: Build (tsc + vite)
        run: pnpm run build
